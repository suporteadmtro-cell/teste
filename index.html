```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Recebimento de Grãos</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#003865;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:1200px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

input,select{
    width:100%;
    padding:10px;
    box-sizing:border-box;
}

button{
    background:#003865;
    color:white;
    border:none;
    padding:12px;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    opacity:0.9;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#003865;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

.kpi{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.card{
    flex:1;
    background:#003865;
    color:white;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

</style>
</head>

<body>

<header>
    <h1>Controle de Recebimento de Grãos</h1>
    <p>Cadastro Operacional</p>
</header>

<div class="container">

<div class="kpi">

    <div class="card">
        <h3 id="totalRegistros">0</h3>
        <p>Registros</p>
    </div>

    <div class="card">
        <h3 id="totalPeso">0</h3>
        <p>Peso Total (kg)</p>
    </div>

</div>

<h2>Novo Lançamento</h2>

<form id="formulario">

<div class="form-grid">

<div>
<label>Data</label>
<input type="date" id="data" required>
</div>

<div>
<label>Terminal</label>
<select id="terminal">
<option>TRO</option>
<option>TRV</option>
<option>TSS</option>
<option>TAG</option>
</select>
</div>

<div>
<label>GMO</label>
<input type="text" id="gmo">
</div>

<div>
<label>Cliente</label>
<input type="text" id="cliente">
</div>

<div>
<label>Produto</label>
<select id="produto">
<option>Soja</option>
<option>Milho</option>
<option>Farelo</option>
</select>
</div>

<div>
<label>Peso Líquido (kg)</label>
<input type="number" id="peso">
</div>

<div>
<label>Umidade (%)</label>
<input type="number" step="0.01" id="umidade">
</div>

</div>

<br>

<button type="submit">
Salvar Registro
</button>

</form>

<h2>Registros</h2>

<table>

<thead>
<tr>
<th>Data</th>
<th>Terminal</th>
<th>GMO</th>
<th>Cliente</th>
<th>Produto</th>
<th>Peso</th>
<th>Umidade</th>
</tr>
</thead>

<tbody id="dados"></tbody>

</table>

</div>

<script>

let registros =
JSON.parse(localStorage.getItem("graos")) || [];

atualizarTabela();

document
.getElementById("formulario")
.addEventListener("submit", function(e){

e.preventDefault();

let novo = {

data: document.getElementById("data").value,
terminal: document.getElementById("terminal").value,
gmo: document.getElementById("gmo").value,
cliente: document.getElementById("cliente").value,
produto: document.getElementById("produto").value,
peso: document.getElementById("peso").value,
umidade: document.getElementById("umidade").value

};

registros.push(novo);

localStorage.setItem(
"graos",
JSON.stringify(registros)
);

this.reset();

atualizarTabela();

});

function atualizarTabela(){

let tabela =
document.getElementById("dados");

tabela.innerHTML = "";

let pesoTotal = 0;

registros.forEach(r=>{

pesoTotal += Number(r.peso || 0);

tabela.innerHTML += `
<tr>
<td>${r.data}</td>
<td>${r.terminal}</td>
<td>${r.gmo}</td>
<td>${r.cliente}</td>
<td>${r.produto}</td>
<td>${r.peso}</td>
<td>${r.umidade}</td>
</tr>
`;

});

document.getElementById("totalRegistros").innerText =
registros.length;

document.getElementById("totalPeso").innerText =
pesoTotal.toLocaleString('pt-BR');

}

</script>

</body>
</html>
```
